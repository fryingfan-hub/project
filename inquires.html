<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inquiries — ITTab</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/inquires.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="container">
  <div class="header">
    <div class="brand">
      <div class="logo">IT</div>
      <div>
        <div class="title">ITTab — Inquiries</div>
        <div class="subtitle">Contact the department — we usually reply within 24–48 hours</div>
      </div>
    </div>

    <div class="row">
      <a href="Admin.html" class="btn ghost">Admin Dashboard</a>
    </div>
  </div>

  <div class="form-grid">

    <!-- LEFT SIDE FORM -->
    <div class="card">
      <h3 style="margin-bottom:12px;">Send an Inquiry</h3>

      <form id="inquiryForm" autocomplete="off">
        
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" required />
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <div class="row space" style="margin-top:10px;">
          <div class="small">By contacting, you consent to receive a reply.</div>
          <div>
            <button type="button" id="resetBtn" class="btn ghost">Reset</button>
            <button type="submit" class="btn">Send</button>
          </div>
        </div>

      </form>

    </div>


    <!-- RIGHT — Preview Inbox (demo only) -->
    <aside class="card">
      <h4 style="margin-bottom:10px;">Admin Inbox (Preview)</h4>
      <div id="previewInbox" class="inbox-list"></div>
    </aside>

  </div>
</div>


<!-- ========================================================= -->
<!--  CONNECT INQUIRY PAGE → ADMIN DASHBOARD                    -->
<!-- ========================================================= -->

<script>
function sendToAdminInbox(name, email, subject, message) {

    // Load admin database
    let raw = localStorage.getItem("tabit_full");
    let db = raw ? JSON.parse(raw) : null;

    // If admin DB is missing, create it
    if (!db) {
        db = {
          faculty: [],
          orgs: [],
          posts: [],
          inbox: [],
          admins: [{ username: "admin" }],
          content: { hero:{title:"TabIT",subtitle:"Lorem ipsum"}, about:{heading:"ABOUT US",body:"..." } }
        };
    }

    // Create message
    const newMsg = {
        from: `${name} (${email})`,
        subject: subject,
        body: message,
        date: new Date().toLocaleString()
    };

    // Add message to admin inbox
    db.inbox.unshift(newMsg);

    // Save back
    localStorage.setItem("tabit_full", JSON.stringify(db));

    Swal.fire({
      icon: "success",
      title: "Inquiry Sent!",
      text: "Your message was delivered to the Admin Dashboard.",
      timer: 2000
    });
}

/* ---------------------------------------------------
   Handle Form Submit
--------------------------------------------------- */
document.getElementById("inquiryForm").addEventListener("submit", function(e){
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !email || !subject || !message) {
      Swal.fire({icon:"error", title:"Please fill out all fields."});
      return;
    }

    sendToAdminInbox(name, email, subject, message);
    this.reset();
});

/* Reset Button */
document.getElementById("resetBtn").onclick = () => {
  document.getElementById("inquiryForm").reset();
};

</script>

</body>
</html>
